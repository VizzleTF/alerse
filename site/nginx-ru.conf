# ru.alerse.app: the Russian site, as nginx.conf, without the www redirect.
server {
    listen 8080 default_server;
    server_name ru.alerse.app;
    # The site keeps no request logs, not even of missing files; the front
    # proxy's are its own.
    access_log off;
    log_not_found off;
    error_log /dev/stderr crit;
    root /usr/share/nginx/html;
    index index.html;

    # /download serves download.html; an unknown path gets a plain 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    # `expires` sets Cache-Control itself, so the server's headers below
    # still apply here (an add_header in a location would drop them).
    location ~* \.(png|ico|css|js)$ {
        expires 7d;
    }

    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    server_tokens off;
}
