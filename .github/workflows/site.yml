# Builds the alerse.app site (site/) into an nginx image, pushes it to
# ghcr.io/vizzletf/alerse-site and signs it with cosign, keyless. Runs on a
# push to main that changes the site. Actions are pinned by commit.
name: site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: a short-lived certificate for this workflow's identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the pages
        run: python3 site/build.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: site
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/vizzletf/alerse-site:latest
            ghcr.io/vizzletf/alerse-site:${{ github.sha }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # By digest, so the signature covers exactly what was pushed. Verify with:
      # cosign verify --certificate-identity-regexp
      # '^https://github.com/VizzleTF/alerse/.github/workflows/site.yml@refs/heads/main$'
      # --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - run: cosign sign --yes "ghcr.io/vizzletf/alerse-site@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
